<title>Pipa Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens Pipa (fonte: docs/interfaces/identidade-visual.md) ===== */
:root{
  color-scheme: light;
  --bg:#F4F1EA; --surface:#FCFBF7; --surface2:#E9E5DC; --term:#FFFDF8;
  --ink:#11141A; --ink2:#3D434F; --ink3:#595F6A;
  --line:#D6D0C4; --line-strong:#857E70;
  --primary:#11141A; --on-primary:#F4F1EA;
  --accent:#F2A93B; --on-accent:#11141A; --accent-text:#8A5300; --accent-surface:#FBE8C4; --focus:#8A5300;
  --ok:#1C6B3B; --ok-surface:#DCEFE2;
  --attn:#8A5300; --attn-surface:#FBE8C4; --attn-strong:#B06C00;
  --armed:#86277D; --on-armed:#FFFFFF; --armed-surface:#F4E0F0;
  --danger:#B0251C; --on-danger:#FFFFFF; --danger-surface:#F8E1DC;
  --offline:#595F6A;
  --scrim:rgba(17,20,26,.48);
  --shadow:0 12px 32px rgba(17,20,26,.18);
  --t0:#1B2326; --t1:#B3261E; --t2:#1C6E3D; --t3:#7A5A00; --t4:#1F58B5; --t5:#8A2A80; --t6:#0A6A73; --t8:#5F6C71;
  --page:#E9E5DC;
  /* VS Code (simulação do tema Light Modern; na extensão real vêm do editor) */
  --vscode-editor-background:#FFFFFF; --vscode-sideBar-background:#F8F8F8; --vscode-panel-background:#F8F8F8;
  --vscode-foreground:#3B3B3B; --vscode-descriptionForeground:#6A6A6A; --vscode-focusBorder:#005FB8;
  --vscode-button-background:#005FB8; --vscode-button-foreground:#FFFFFF;
  --vscode-button-secondaryBackground:#E5E5E5; --vscode-button-secondaryForeground:#3B3B3B;
  --vscode-statusBar-background:#F8F8F8; --vscode-statusBar-foreground:#3B3B3B; --vscode-statusBar-border:#E5E5E5;
  --vscode-statusBarItem-warningBackground:#8F5A00; --vscode-statusBarItem-warningForeground:#FFFFFF;
  --vscode-widget-border:#E5E5E5; --vscode-editorWidget-background:#F8F8F8; --vscode-input-background:#FFFFFF; --vscode-input-border:#CECECE;
  --vscode-textLink-foreground:#005FB8; --vscode-list-activeSelectionBackground:#E8E8E8; --vscode-terminal-foreground:#3B3B3B;
  --vscode-titleBar-background:#F8F8F8; --vscode-activityBar-background:#F8F8F8; --vscode-tab-activeBackground:#FFFFFF; --vscode-tab-inactiveBackground:#F8F8F8;
  --vscode-terminal-ansiYellow:#8A5300; --vscode-notifications-background:#FFFFFF;
  --vscode-editor-font-family: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
  --vscode-font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-ui:"IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11141A; --surface:#191D25; --surface2:#232833; --term:#0C0E12;
    --ink:#ECE8DF; --ink2:#A3AAB8; --ink3:#8A91A0;
    --line:#2C323D; --line-strong:#6E7684;
    --primary:#ECE8DF; --on-primary:#11141A;
    --accent:#F2A93B; --on-accent:#11141A; --accent-text:#F2A93B; --accent-surface:#3A2C12; --focus:#F2A93B;
    --ok:#6CCB91; --ok-surface:#132D1F;
    --attn:#F2A93B; --attn-surface:#3A2C12; --attn-strong:#F2A93B;
    --armed:#E48ADB; --on-armed:#2A0827; --armed-surface:#37163A;
    --danger:#FF8A7D; --on-danger:#3A0803; --danger-surface:#3B1511;
    --offline:#8A91A0;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
    --t0:#A7B3B8; --t1:#FF8A7D; --t2:#6CCB91; --t3:#EDBE4C; --t4:#7FB0FF; --t5:#E48ADB; --t6:#5FC4CD; --t8:#8A979C;
    --page:#0B0D11;
    --vscode-editor-background:#1F1F1F; --vscode-sideBar-background:#181818; --vscode-panel-background:#181818;
    --vscode-foreground:#CCCCCC; --vscode-descriptionForeground:#9D9D9D; --vscode-focusBorder:#0078D4;
    --vscode-button-background:#0078D4; --vscode-button-foreground:#FFFFFF;
    --vscode-button-secondaryBackground:#313131; --vscode-button-secondaryForeground:#CCCCCC;
    --vscode-statusBar-background:#181818; --vscode-statusBar-foreground:#CCCCCC; --vscode-statusBar-border:#2B2B2B;
    --vscode-statusBarItem-warningBackground:#8F5A00; --vscode-statusBarItem-warningForeground:#FFFFFF;
    --vscode-widget-border:#2B2B2B; --vscode-editorWidget-background:#202020; --vscode-input-background:#313131; --vscode-input-border:#3C3C3C;
    --vscode-textLink-foreground:#4DAAFC; --vscode-list-activeSelectionBackground:#2A2D2E; --vscode-terminal-foreground:#CCCCCC;
    --vscode-titleBar-background:#181818; --vscode-activityBar-background:#181818; --vscode-tab-activeBackground:#1F1F1F; --vscode-tab-inactiveBackground:#181818;
    --vscode-terminal-ansiYellow:#E5C07B; --vscode-notifications-background:#202020;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11141A; --surface:#191D25; --surface2:#232833; --term:#0C0E12;
  --ink:#ECE8DF; --ink2:#A3AAB8; --ink3:#8A91A0;
  --line:#2C323D; --line-strong:#6E7684;
  --primary:#ECE8DF; --on-primary:#11141A;
  --accent:#F2A93B; --on-accent:#11141A; --accent-text:#F2A93B; --accent-surface:#3A2C12; --focus:#F2A93B;
  --ok:#6CCB91; --ok-surface:#132D1F;
  --attn:#F2A93B; --attn-surface:#3A2C12; --attn-strong:#F2A93B;
  --armed:#E48ADB; --on-armed:#2A0827; --armed-surface:#37163A;
  --danger:#FF8A7D; --on-danger:#3A0803; --danger-surface:#3B1511;
  --offline:#8A91A0;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --t0:#A7B3B8; --t1:#FF8A7D; --t2:#6CCB91; --t3:#EDBE4C; --t4:#7FB0FF; --t5:#E48ADB; --t6:#5FC4CD; --t8:#8A979C;
  --page:#0B0D11;
  --vscode-editor-background:#1F1F1F; --vscode-sideBar-background:#181818; --vscode-panel-background:#181818;
  --vscode-foreground:#CCCCCC; --vscode-descriptionForeground:#9D9D9D; --vscode-focusBorder:#0078D4;
  --vscode-button-background:#0078D4; --vscode-button-foreground:#FFFFFF;
  --vscode-button-secondaryBackground:#313131; --vscode-button-secondaryForeground:#CCCCCC;
  --vscode-statusBar-background:#181818; --vscode-statusBar-foreground:#CCCCCC; --vscode-statusBar-border:#2B2B2B;
  --vscode-statusBarItem-warningBackground:#8F5A00; --vscode-statusBarItem-warningForeground:#FFFFFF;
  --vscode-widget-border:#2B2B2B; --vscode-editorWidget-background:#202020; --vscode-input-background:#313131; --vscode-input-border:#3C3C3C;
  --vscode-textLink-foreground:#4DAAFC; --vscode-list-activeSelectionBackground:#2A2D2E; --vscode-terminal-foreground:#CCCCCC;
  --vscode-titleBar-background:#181818; --vscode-activityBar-background:#181818; --vscode-tab-activeBackground:#1F1F1F; --vscode-tab-inactiveBackground:#181818;
  --vscode-terminal-ansiYellow:#E5C07B; --vscode-notifications-background:#202020;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s18{width:18px;height:18px}
svg.i.s16{width:16px;height:16px}
.mono{font-family:var(--font-mono)}

/* ===== Moldura do protótipo ===== */
.top{max-width:1320px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-family:var(--font-mono);font-weight:800;font-size:28px;letter-spacing:-1px;line-height:1}
.brand h1 span{color:var(--accent-text)}
.brand p{margin:4px 0 0;color:var(--ink2);font-size:14px;max-width:62ch}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.segp{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.segp button{border:0;background:transparent;min-height:40px;padding:0 12px;cursor:pointer;font-size:14px;color:var(--ink)}
.segp button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
select.jump{min-height:40px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:0 8px;max-width:260px}
.plain{min-height:40px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;padding:0 12px;cursor:pointer;font-size:14px}
.stage{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.col > h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}

/* ===== Celular ===== */
.phone{width:min(380px,100%);margin:0 auto;border:10px solid var(--frame);border-radius:38px;background:var(--bg);overflow:hidden;box-shadow:0 20px 50px rgba(17,20,26,.25);position:relative}
.screen{height:760px;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.sbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:600;color:var(--ink);font-family:var(--font-ui)}
.sbar .ic{display:flex;gap:6px;align-items:center}
.gbar{height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.gbar i{width:110px;height:4px;border-radius:2px;background:var(--ink);opacity:.5}
.content{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.appbar{min-height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 4px;background:var(--bg)}
.appbar .ttl{flex:1;min-width:0;padding-left:4px}
.appbar .ttl b{display:block;font-size:18px;font-weight:600;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{display:block;font-family:var(--font-mono);font-size:12px;color:var(--ink2);line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ib:hover{background:var(--surface2)}
.wordmark{display:flex;align-items:center;gap:8px;padding-left:12px;flex:1}
.wordmark b{font-family:var(--font-mono);font-weight:800;font-size:22px;letter-spacing:-.5px}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{min-height:48px;border-radius:8px;border:1px solid transparent;padding:0 20px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.full{width:100%}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.armed{background:var(--armed);color:var(--on-armed)}
.btn.text{background:transparent;color:var(--accent-text);padding:0 12px}
.btn[aria-disabled="true"]{background:var(--surface2);color:var(--ink3);border-color:var(--surface2);cursor:not-allowed}
.row{display:flex;gap:12px}
.row>.btn{flex:1}
.hint{font-size:13px;color:var(--ink2);margin:0}
.h1{font-size:24px;line-height:30px;font-weight:600;margin:0;text-wrap:balance}
.h2{font-size:18px;line-height:24px;font-weight:600;margin:0}
.body{font-size:15px;line-height:22px;color:var(--ink2);margin:0}

.welcome-hero{display:flex;flex-direction:column;gap:14px;padding:28px 20px 8px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px;line-height:22px}
.steps li::before{content:counter(s);font-family:var(--font-mono);font-weight:600;font-size:13px;width:28px;height:28px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 16px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.li:hover{background:var(--surface2)}
.li .main{flex:1;min-width:0}
.li .name{font-weight:600;font-size:16px;line-height:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li .sub{display:block;font-family:var(--font-mono);font-size:12.5px;line-height:18px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap}
.chip.attn{background:var(--attn-surface);color:var(--attn)}
.chip.ok{background:var(--ok-surface);color:var(--ok)}
.chip.danger{background:var(--danger-surface);color:var(--danger)}
.chip.neutral{background:var(--surface2);color:var(--ink2)}
.chip.armed{background:var(--armed-surface);color:var(--armed)}
.chip.off{background:var(--surface2);color:var(--offline)}
.st{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.st.attn{background:var(--attn-surface);color:var(--attn)}
.st.ok{background:var(--ok-surface);color:var(--ok)}
.st.danger{background:var(--danger-surface);color:var(--danger)}
.st.neutral{background:var(--surface2);color:var(--ink2)}
.st.off{background:var(--surface2);color:var(--offline)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sec{font-size:13px;font-weight:600;color:var(--ink2);padding:16px 16px 6px;margin:0}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;font-size:14px;line-height:20px;border-bottom:1px solid var(--line)}
.banner.attn{background:var(--accent);color:var(--on-accent);border:0}
.banner.danger{background:var(--danger-surface);color:var(--danger)}
.banner.neutral{background:var(--surface2);color:var(--ink)}
.banner.armed{background:var(--armed);color:var(--on-armed);border:0}
.banner .grow{flex:1;min-width:0}
.banner .act{margin:-10px -8px -10px 0}
.banner .act .btn{min-height:44px}
.banner.attn .btn.text,.banner.armed .btn.text{color:inherit;text-decoration:underline}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:32px 20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.input{min-height:52px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;width:100%}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.input.code{font-family:var(--font-mono);font-size:22px;letter-spacing:.06em;text-align:center;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 16px}
.tabs button{flex:1;min-height:48px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.viewfinder{margin:16px;aspect-ratio:1/1;max-width:100%;border-radius:16px;background:#11141A;position:relative;display:grid;place-items:center;overflow:hidden}
.viewfinder .frame{width:62%;aspect-ratio:1/1;border:3px solid #F2A93B;border-radius:18px}
.viewfinder small{position:absolute;bottom:14px;left:14px;right:14px;color:#ECE8DF;font-size:13px;text-align:center}
.sas{font-family:var(--font-mono);font-size:40px;font-weight:800;letter-spacing:.06em;text-align:center;padding:18px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--accent-text);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errcard{display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--danger-surface);color:var(--danger)}
.errcard b{display:block;font-size:15px}
.errcard p{margin:4px 0 0;color:var(--ink);font-size:14px;line-height:20px}

/* terminal */
.modebar{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 8px 4px 16px;font-size:14px}
.modebar.ro{background:var(--surface2);color:var(--ink)}
.modebar.on{background:var(--armed);color:var(--on-armed)}
.modebar .grow{flex:1;min-width:0;line-height:18px}
.modebar small{display:block;font-size:12px;opacity:.9}
.modebar .btn{min-height:44px;padding:0 14px}
.modebar.on .btn{background:transparent;color:var(--on-armed);border-color:var(--on-armed)}
.term{flex:1;min-height:0;overflow:auto;background:var(--term);font-family:var(--font-mono);font-size:13px;line-height:19px;padding:10px 12px;color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.term .ln{white-space:pre-wrap;word-break:break-word;min-height:19px}
.term .meta{font-family:var(--font-ui);font-size:12px;color:var(--ink2);padding:6px 0;display:flex;gap:8px;align-items:center}
.t-dim{color:var(--t8)}.t-red{color:var(--t1)}.t-green{color:var(--t2)}.t-yellow{color:var(--t3)}.t-blue{color:var(--t4)}.t-magenta{color:var(--t5)}.t-cyan{color:var(--t6)}.t-b{font-weight:600}
.pinned{display:flex;gap:10px;align-items:center;background:var(--accent);color:var(--on-accent);padding:6px 8px 6px 14px;font-size:14px}
.pinned .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinned .btn{min-height:40px;background:var(--on-accent);color:var(--accent);padding:0 12px;font-size:14px}
.composer{padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.composer .line{display:flex;gap:8px;align-items:stretch}
.composer .input{min-height:48px;font-family:var(--font-mono);font-size:14px}
.composer .input:disabled{background:var(--surface2);color:var(--ink3);border-color:var(--line)}
.composer .send{width:56px;min-height:48px;padding:0}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.keys .k-enter{grid-column:1 / span 2}
.keys .k-ctrlc{grid-column:5 / span 2;border-color:var(--danger);color:var(--danger)}
.keys button{min-width:48px;height:48px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-family:var(--font-mono);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.keys button[aria-disabled="true"]{color:var(--ink3);border-color:var(--line);background:var(--surface2);cursor:not-allowed}
.keys .sep{width:1px;background:var(--line);flex:none;margin:6px 4px}
.statusline{font-size:13px;line-height:18px;padding:0 4px;color:var(--ink2);min-height:18px}
.statusline.err{color:var(--danger)}
.statusline.ok{color:var(--ok)}

/* atenção */
.attn-body{padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px}
.srcbadge{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.srcbadge.warn{color:var(--attn);background:var(--attn-surface);padding:8px 10px;border-radius:8px;align-items:flex-start;line-height:18px}

function qrSvg(){
  let seed=48219137; const r=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const N=29; let rects='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9); if(!inF && r()>.52) rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`; }
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" role="img" aria-label="${T('vsc.pair_qr_alt')} (${T('proto.fake_qr')})" shape-rendering="crispEdges"><rect width="${N}" height="${N}" fill="#fff"/>${rects}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

function vsQp(){

  vsRevokeYes(id){ const d=S.vs.devices.find(x=>x.id===id); S.vs.modal=null; S.vs.devices=S.vs.devices.filter(x=>x.id!==id); toast({text:t('vsc.revoked_toast',{device:d.name})}); if(d.name==='Pixel 8'||d.name===S.deviceName){ S.stack=[]; S.overlay=null; S.screen='revoked'; } },
  vsToastClose(i){ S.vs.toasts.splice(+i,1); },
  simClaim(){ if(S.screen!=='add'&&S.screen!=='welcome'){ S.stack=[]; S.screen='add'; } startPair(); return 'skip'; },
  simAttn(){ S.attn='open'; S.heads=true; },
};
function setTheme(v){ if(v==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); }
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-proto]');
  if(p){ const [k,v]=p.dataset.proto.split(':'); if(k==='lang'){ S.lang=v; } if(k==='theme'){ setTheme(v); } if(k==='reset'){ const l=S.lang; Object.assign(S,fresh()); S.lang=l; document.getElementById('jump').value='welcome'; } render(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.hasAttribute('data-stop') ) return;
  if(e.target.closest('[data-stop]') && el.classList.contains('scrim')) return;
  if(el.getAttribute('aria-disabled')==='true'){ e.preventDefault(); const w=document.getElementById('sendWhy')||document.getElementById('codeLeft'); if(w) w.style.fontWeight='700'; return; }
  const [k,...r]=el.dataset.act.split(':'); const a=r.join(':');
  e.preventDefault();
  if(k==='go'){ ACT.go(a); } else if(ACT[k]){ if(ACT[k](a)==='skip') return; }
  render();
});
document.addEventListener('submit',e=>{ e.preventDefault(); const f=e.target.dataset.form;
  if(f==='code'){ if(S.code.length===12){ S.pairErr=null; startPair(); } return; }
  if(f==='send'){ if(!isArmed(S.sid)){ S.send='not_armed'; render(); return; } if(!S.draft.trim()) return; S.send='sending'; render();
    setTimeout(()=>{ S.sent.push(S.draft); S.draft=''; S.send='sent'; render(); },600); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='code'){ const d=e.target.value.replace(/\D/g,'').slice(0,12); S.code=d; e.target.value=fmtCode(d);
    const full=d.length===12; document.getElementById('codeLeft').textContent = full?t('add.code_complete'):t('add.code_missing',{n:12-d.length});
    document.getElementById('codeSubmit').setAttribute('aria-disabled', !full); }
  if(e.target.id==='draft'){ S.draft=e.target.value; }
  if(e.target.id==='dname'){ S.deviceName=e.target.value||'Pixel 8'; }
});
document.getElementById('jump').addEventListener('change',e=>applyPreset(e.target.value));
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-until]').forEach(el=>{ el.textContent = t(el.dataset.fmt,{time:mmss(+el.dataset.until-now)}); });
  let changed=false;
  for(const k in S.armed){ if(S.armed[k]<=now){ delete S.armed[k]; changed=true; if(S.screen==='session'&&S.sid===k){ S.snack={text:t('arm.expired')}; if(S.draft) S.send=null; } } }
  if(S.vs.pair && S.vs.pairState==='waiting' && S.vs.pairEnd<=now){ S.vs.pairState='expired'; changed=true; }
  return changed;
}
setInterval(()=>{ if(tick()) render(); },1000);
render();
/* link direto para um estado: ...#session_armed */
(function(){ const id=location.hash.slice(1); if(id && PRESETS.some(([,it])=>it.some(([p])=>p===id))){ applyPreset(id); document.getElementById('jump').value=id; } })();
</script>
