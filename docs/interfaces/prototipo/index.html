<title>Pipa Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens Pipa (fonte: docs/interfaces/identidade-visual.md) ===== */
:root{
  color-scheme: light;
  --bg:#F4F1EA; --surface:#FCFBF7; --surface2:#E9E5DC; --term:#FFFDF8;
  --ink:#11141A; --ink2:#3D434F; --ink3:#595F6A;
  --line:#D6D0C4; --line-strong:#857E70;
  --primary:#11141A; --on-primary:#F4F1EA;
  --accent:#F2A93B; --on-accent:#11141A; --accent-text:#8A5300; --accent-surface:#FBE8C4; --focus:#8A5300;
  --ok:#1C6B3B; --ok-surface:#DCEFE2;
  --attn:#8A5300; --attn-surface:#FBE8C4; --attn-strong:#B06C00;
  --armed:#86277D; --on-armed:#FFFFFF; --armed-surface:#F4E0F0;
  --danger:#B0251C; --on-danger:#FFFFFF; --danger-surface:#F8E1DC;
  --offline:#595F6A; --kite-tail:#11141A; --frame:#11141A;
  --scrim:rgba(17,20,26,.48);
  --shadow:0 12px 32px rgba(17,20,26,.18);
  --t0:#1B2326; --t1:#B3261E; --t2:#1C6E3D; --t3:#7A5A00; --t4:#1F58B5; --t5:#8A2A80; --t6:#0A6A73; --t8:#5F6C71;
  --page:#E9E5DC;
  /* VS Code (simulação do tema Light Modern; na extensão real vêm do editor) */
  --vscode-editor-background:#FFFFFF; --vscode-sideBar-background:#F8F8F8; --vscode-panel-background:#F8F8F8;
  --vscode-foreground:#3B3B3B; --vscode-descriptionForeground:#6A6A6A; --vscode-focusBorder:#005FB8;
  --vscode-button-background:#005FB8; --vscode-button-foreground:#FFFFFF;
  --vscode-button-secondaryBackground:#E5E5E5; --vscode-button-secondaryForeground:#3B3B3B;
  --vscode-statusBar-background:#F8F8F8; --vscode-statusBar-foreground:#3B3B3B; --vscode-statusBar-border:#E5E5E5;
  --vscode-statusBarItem-warningBackground:#8F5A00; --vscode-statusBarItem-warningForeground:#FFFFFF;
  --vscode-widget-border:#E5E5E5; --vscode-editorWidget-background:#F8F8F8; --vscode-input-background:#FFFFFF; --vscode-input-border:#CECECE;
  --vscode-textLink-foreground:#005FB8; --vscode-list-activeSelectionBackground:#E8E8E8; --vscode-terminal-foreground:#3B3B3B;
  --vscode-titleBar-background:#F8F8F8; --vscode-activityBar-background:#F8F8F8; --vscode-tab-activeBackground:#FFFFFF; --vscode-tab-inactiveBackground:#F8F8F8;
  --vscode-terminal-ansiYellow:#8A5300; --vscode-notifications-background:#FFFFFF;
  --vscode-editor-font-family: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
  --vscode-font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-ui:"IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11141A; --surface:#191D25; --surface2:#232833; --term:#0C0E12;
    --ink:#ECE8DF; --ink2:#A3AAB8; --ink3:#8A91A0;
    --line:#2C323D; --line-strong:#6E7684;
    --primary:#ECE8DF; --on-primary:#11141A;
    --accent:#F2A93B; --on-accent:#11141A; --accent-text:#F2A93B; --accent-surface:#3A2C12; --focus:#F2A93B;
    --ok:#6CCB91; --ok-surface:#132D1F;
    --attn:#F2A93B; --attn-surface:#3A2C12; --attn-strong:#F2A93B;
    --armed:#E48ADB; --on-armed:#2A0827; --armed-surface:#37163A;
    --danger:#FF8A7D; --on-danger:#3A0803; --danger-surface:#3B1511;
    --offline:#8A91A0; --kite-tail:#F2A93B; --frame:#3A404C;
    --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
    --t0:#A7B3B8; --t1:#FF8A7D; --t2:#6CCB91; --t3:#EDBE4C; --t4:#7FB0FF; --t5:#E48ADB; --t6:#5FC4CD; --t8:#8A979C;
    --page:#0B0D11;
    --vscode-editor-background:#1F1F1F; --vscode-sideBar-background:#181818; --vscode-panel-background:#181818;
    --vscode-foreground:#CCCCCC; --vscode-descriptionForeground:#9D9D9D; --vscode-focusBorder:#0078D4;
    --vscode-button-background:#0078D4; --vscode-button-foreground:#FFFFFF;
    --vscode-button-secondaryBackground:#313131; --vscode-button-secondaryForeground:#CCCCCC;
    --vscode-statusBar-background:#181818; --vscode-statusBar-foreground:#CCCCCC; --vscode-statusBar-border:#2B2B2B;
    --vscode-statusBarItem-warningBackground:#8F5A00; --vscode-statusBarItem-warningForeground:#FFFFFF;
    --vscode-widget-border:#2B2B2B; --vscode-editorWidget-background:#202020; --vscode-input-background:#313131; --vscode-input-border:#3C3C3C;
    --vscode-textLink-foreground:#4DAAFC; --vscode-list-activeSelectionBackground:#2A2D2E; --vscode-terminal-foreground:#CCCCCC;
    --vscode-titleBar-background:#181818; --vscode-activityBar-background:#181818; --vscode-tab-activeBackground:#1F1F1F; --vscode-tab-inactiveBackground:#181818;
    --vscode-terminal-ansiYellow:#E5C07B; --vscode-notifications-background:#202020;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11141A; --surface:#191D25; --surface2:#232833; --term:#0C0E12;
  --ink:#ECE8DF; --ink2:#A3AAB8; --ink3:#8A91A0;
  --line:#2C323D; --line-strong:#6E7684;
  --primary:#ECE8DF; --on-primary:#11141A;
  --accent:#F2A93B; --on-accent:#11141A; --accent-text:#F2A93B; --accent-surface:#3A2C12; --focus:#F2A93B;
  --ok:#6CCB91; --ok-surface:#132D1F;
  --attn:#F2A93B; --attn-surface:#3A2C12; --attn-strong:#F2A93B;
  --armed:#E48ADB; --on-armed:#2A0827; --armed-surface:#37163A;
  --danger:#FF8A7D; --on-danger:#3A0803; --danger-surface:#3B1511;
  --offline:#8A91A0; --kite-tail:#F2A93B; --frame:#3A404C;
  --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --t0:#A7B3B8; --t1:#FF8A7D; --t2:#6CCB91; --t3:#EDBE4C; --t4:#7FB0FF; --t5:#E48ADB; --t6:#5FC4CD; --t8:#8A979C;
  --page:#0B0D11;
  --vscode-editor-background:#1F1F1F; --vscode-sideBar-background:#181818; --vscode-panel-background:#181818;
  --vscode-foreground:#CCCCCC; --vscode-descriptionForeground:#9D9D9D; --vscode-focusBorder:#0078D4;
  --vscode-button-background:#0078D4; --vscode-button-foreground:#FFFFFF;
  --vscode-button-secondaryBackground:#313131; --vscode-button-secondaryForeground:#CCCCCC;
  --vscode-statusBar-background:#181818; --vscode-statusBar-foreground:#CCCCCC; --vscode-statusBar-border:#2B2B2B;
  --vscode-statusBarItem-warningBackground:#8F5A00; --vscode-statusBarItem-warningForeground:#FFFFFF;
  --vscode-widget-border:#2B2B2B; --vscode-editorWidget-background:#202020; --vscode-input-background:#313131; --vscode-input-border:#3C3C3C;
  --vscode-textLink-foreground:#4DAAFC; --vscode-list-activeSelectionBackground:#2A2D2E; --vscode-terminal-foreground:#CCCCCC;
  --vscode-titleBar-background:#181818; --vscode-activityBar-background:#181818; --vscode-tab-activeBackground:#1F1F1F; --vscode-tab-inactiveBackground:#181818;
  --vscode-terminal-ansiYellow:#E5C07B; --vscode-notifications-background:#202020;
}

*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s18{width:18px;height:18px}
svg.i.s16{width:16px;height:16px}
.mono{font-family:var(--font-mono)}

/* ===== Moldura do protótipo ===== */
.top{max-width:1320px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-family:var(--font-mono);font-weight:800;font-size:28px;letter-spacing:-1px;line-height:1}
.brand h1 span{color:var(--accent-text)}
.brand p{margin:4px 0 0;color:var(--ink2);font-size:14px;max-width:62ch}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.segp{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.segp button{border:0;background:transparent;min-height:40px;padding:0 12px;cursor:pointer;font-size:14px;color:var(--ink)}
.segp button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
select.jump{min-height:40px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:0 8px;max-width:260px}
.plain{min-height:40px;border:1px solid var(--line-strong);border-radius:8px;background:transparent;padding:0 12px;cursor:pointer;font-size:14px}
.stage{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.col > h2{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}

/* ===== Celular ===== */
.phone{width:min(380px,100%);margin:0 auto;border:10px solid var(--frame);border-radius:38px;background:var(--bg);overflow:hidden;box-shadow:0 20px 50px rgba(17,20,26,.25);position:relative}
.screen{height:760px;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.sbar{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;font-weight:600;color:var(--ink);font-family:var(--font-ui)}
.sbar .ic{display:flex;gap:6px;align-items:center}
.gbar{height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.gbar i{width:110px;height:4px;border-radius:2px;background:var(--ink);opacity:.5}
.content{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.appbar{min-height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 4px;background:var(--bg)}
.appbar .ttl{flex:1;min-width:0;padding-left:4px}
.appbar .ttl b{display:block;font-size:18px;font-weight:600;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{display:block;font-family:var(--font-mono);font-size:12px;color:var(--ink2);line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ib:hover{background:var(--surface2)}
.wordmark{display:flex;align-items:center;gap:8px;padding-left:12px;flex:1}
.wordmark b{font-family:var(--font-mono);font-weight:800;font-size:22px;letter-spacing:-.5px}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{min-height:48px;border-radius:8px;border:1px solid transparent;padding:0 20px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.full{width:100%}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.armed{background:var(--armed);color:var(--on-armed)}
.btn.text{background:transparent;color:var(--accent-text);padding:0 12px}
.btn[aria-disabled="true"]{background:var(--surface2);color:var(--ink3);border-color:var(--surface2);cursor:not-allowed}
.row{display:flex;gap:12px}
.row>.btn{flex:1}
.hint{font-size:13px;color:var(--ink2);margin:0}
.h1{font-size:24px;line-height:30px;font-weight:600;margin:0;text-wrap:balance}
.h2{font-size:18px;line-height:24px;font-weight:600;margin:0}
.body{font-size:15px;line-height:22px;color:var(--ink2);margin:0}

.welcome-hero{display:flex;flex-direction:column;gap:14px;padding:28px 20px 8px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15px;line-height:22px}
.steps li::before{content:counter(s);font-family:var(--font-mono);font-weight:600;font-size:13px;width:28px;height:28px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 16px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.li:hover{background:var(--surface2)}
.li .main{flex:1;min-width:0}
.li .name{font-weight:600;font-size:16px;line-height:22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li .sub{display:block;font-family:var(--font-mono);font-size:12.5px;line-height:18px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:12px;line-height:16px;font-weight:600;padding:3px 7px;border-radius:6px;white-space:nowrap}
.chip.attn{background:var(--attn-surface);color:var(--attn)}
.chip.ok{background:var(--ok-surface);color:var(--ok)}
.chip.danger{background:var(--danger-surface);color:var(--danger)}
.chip.neutral{background:var(--surface2);color:var(--ink2)}
.chip.armed{background:var(--armed-surface);color:var(--armed)}
.chip.off{background:var(--surface2);color:var(--offline)}
.st{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.st.attn{background:var(--attn-surface);color:var(--attn)}
.st.ok{background:var(--ok-surface);color:var(--ok)}
.st.danger{background:var(--danger-surface);color:var(--danger)}
.st.neutral{background:var(--surface2);color:var(--ink2)}
.st.off{background:var(--surface2);color:var(--offline)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sec{font-size:13px;font-weight:600;color:var(--ink2);padding:16px 16px 6px;margin:0}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;font-size:14px;line-height:20px;border-bottom:1px solid var(--line)}
.banner.attn{background:var(--accent);color:var(--on-accent);border:0}
.banner.danger{background:var(--danger-surface);color:var(--danger)}
.banner.neutral{background:var(--surface2);color:var(--ink)}
.banner.armed{background:var(--armed);color:var(--on-armed);border:0}
.banner .grow{flex:1;min-width:0}
.banner .act{margin:-10px -8px -10px 0}
.banner .act .btn{min-height:44px}
.banner.attn .btn.text,.banner.armed .btn.text{color:inherit;text-decoration:underline}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:32px 20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.input{min-height:52px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;padding:0 14px;width:100%}
.input:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.input.code{font-family:var(--font-mono);font-size:22px;letter-spacing:.06em;text-align:center;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 16px}
.tabs button{flex:1;min-height:48px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.viewfinder{margin:16px;aspect-ratio:1/1;max-width:100%;border-radius:16px;background:#11141A;position:relative;display:grid;place-items:center;overflow:hidden}
.viewfinder .frame{width:62%;aspect-ratio:1/1;border:3px solid #F2A93B;border-radius:18px}
.viewfinder small{position:absolute;bottom:14px;left:14px;right:14px;color:#ECE8DF;font-size:13px;text-align:center}
.sas{font-family:var(--font-mono);font-size:40px;font-weight:800;letter-spacing:.06em;text-align:center;padding:18px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-variant-numeric:tabular-nums}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--accent-text);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errcard{display:flex;gap:12px;padding:14px;border-radius:12px;background:var(--danger-surface);color:var(--danger)}
.errcard b{display:block;font-size:15px}
.errcard p{margin:4px 0 0;color:var(--ink);font-size:14px;line-height:20px}

/* terminal */
.modebar{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 8px 4px 16px;font-size:14px}
.modebar.ro{background:var(--surface2);color:var(--ink)}
.modebar.on{background:var(--armed);color:var(--on-armed)}
.modebar .grow{flex:1;min-width:0;line-height:18px}
.modebar small{display:block;font-size:12px;opacity:.9}
.modebar .btn{min-height:44px;padding:0 14px}
.modebar.on .btn{background:transparent;color:var(--on-armed);border-color:var(--on-armed)}
.term{flex:1;min-height:0;overflow:auto;background:var(--term);font-family:var(--font-mono);font-size:13px;line-height:19px;padding:10px 12px;color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.term .ln{white-space:pre-wrap;word-break:break-word;min-height:19px}
.term .meta{font-family:var(--font-ui);font-size:12px;color:var(--ink2);padding:6px 0;display:flex;gap:8px;align-items:center}
.t-dim{color:var(--t8)}.t-red{color:var(--t1)}.t-green{color:var(--t2)}.t-yellow{color:var(--t3)}.t-blue{color:var(--t4)}.t-magenta{color:var(--t5)}.t-cyan{color:var(--t6)}.t-b{font-weight:600}
.pinned{display:flex;gap:10px;align-items:center;background:var(--accent);color:var(--on-accent);padding:6px 8px 6px 14px;font-size:14px}
.pinned .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinned .btn{min-height:40px;background:var(--on-accent);color:var(--accent);padding:0 12px;font-size:14px}
.composer{padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.composer .line{display:flex;gap:8px;align-items:stretch}
.composer .input{min-height:48px;font-family:var(--font-mono);font-size:14px}
.composer .input:disabled{background:var(--surface2);color:var(--ink3);border-color:var(--line)}
.composer .send{width:56px;min-height:48px;padding:0}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.keys .k-enter{grid-column:1 / span 2}
.keys .k-ctrlc{grid-column:5 / span 2;border-color:var(--danger);color:var(--danger)}
.keys button{min-width:48px;height:48px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-family:var(--font-mono);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.keys button[aria-disabled="true"]{color:var(--ink3);border-color:var(--line);background:var(--surface2);cursor:not-allowed}
.keys .sep{width:1px;background:var(--line);flex:none;margin:6px 4px}
.statusline{font-size:13px;line-height:18px;padding:0 4px;color:var(--ink2);min-height:18px}
.statusline.err{color:var(--danger)}
.statusline.ok{color:var(--ok)}

/* atenção */
.attn-body{padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px}
.srcbadge{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
.srcbadge.warn{color:var(--attn);background:var(--attn-surface);padding:8px 10px;border-radius:8px;align-items:flex-start;line-height:18px}
.cmdbox{font-family:var(--font-mono);font-size:15px;line-height:22px;background:var(--term);border:1px solid var(--line-strong);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;user-select:text}
.note{display:flex;gap:10px;padding:12px;border-radius:10px;font-size:14px;line-height:20px}
.note.danger{background:var(--danger-surface);color:var(--danger)}
.note.neutral{background:var(--surface2);color:var(--ink)}
.note.ok{background:var(--ok-surface);color:var(--ok)}
.note.attn{background:var(--attn-surface);color:var(--attn)}
.actions{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);background:var(--bg)}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:5}
.scrim.center{align-items:center;justify-content:center;padding:24px}
.sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--line-strong);margin:4px auto 0}
.dialog{width:100%;background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dialog .btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:transparent;cursor:pointer;font-family:var(--font-mono);font-weight:600;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--primary);color:var(--on-primary)}
.bio{background:var(--surface);border-radius:24px 24px 0 0;width:100%;padding:24px 20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bio .fp{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--surface2);color:var(--ink);cursor:pointer;margin:16px 0 4px}
.bio .fp svg{width:40px;height:40px}
.bio .actions2{display:flex;justify-content:space-between;width:100%;margin-top:8px}
.snack{position:absolute;left:12px;right:12px;bottom:26px;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 14px;font-size:14px;line-height:20px;display:flex;gap:12px;align-items:center;z-index:6;box-shadow:var(--shadow)}
.snack .grow{flex:1}
.heads{position:absolute;left:8px;right:8px;top:32px;z-index:7;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;cursor:pointer;text-align:left;color:var(--ink)}
.heads small{display:block;color:var(--ink2);font-size:12px}
.appicon{width:36px;height:36px;border-radius:9px;background:#11141A;display:grid;place-items:center;flex:none}
.lock{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 12px;gap:6px;background:#11141A;color:#ECE8DF}
.lock .clock{font-size:64px;font-weight:300;line-height:1;letter-spacing:-2px}
.lock .date{font-size:14px;opacity:.85;margin-bottom:28px}
.lock .n{width:100%;background:#232833;border-radius:16px;padding:12px 14px;display:flex;gap:12px;border:0;color:#ECE8DF;text-align:left;cursor:pointer}
.lock .n small{display:block;color:#A3AAB8;font-size:12px}
.lock .cap{font-size:12px;color:#A3AAB8;margin-top:6px;align-self:flex-start}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:8px 16px;border-bottom:1px solid var(--line)}
.setrow .l{min-width:0}
.setrow .l b{display:block;font-weight:600;font-size:15px}
.setrow .l small{display:block;color:var(--ink2);font-size:13px;line-height:18px}
.switch{width:52px;height:32px;border-radius:16px;border:2px solid var(--line-strong);background:var(--surface2);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--line-strong);transition:left .15s}
.switch[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.switch[aria-checked="true"]::after{left:24px;background:var(--on-primary)}
.audit{font-size:13px;line-height:18px;padding:8px 16px;display:grid;grid-template-columns:52px 1fr;gap:8px;border-bottom:1px solid var(--line)}
.audit time{font-family:var(--font-mono);color:var(--ink2);font-variant-numeric:tabular-nums}

/* ===== VS Code (simulação) ===== */
.vsc{border:1px solid var(--vscode-widget-border);border-radius:10px;overflow:hidden;background:var(--vscode-editor-background);color:var(--vscode-foreground);font-family:var(--vscode-font-family);font-size:13px;line-height:1.4;position:relative;display:flex;flex-direction:column;min-height:640px}
.vs-title{height:34px;background:var(--vscode-titleBar-background);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--vscode-descriptionForeground);border-bottom:1px solid var(--vscode-widget-border);flex:none}
.vs-body{flex:1;display:flex;min-height:0}
.vs-act{width:44px;background:var(--vscode-activityBar-background);border-right:1px solid var(--vscode-widget-border);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;color:var(--vscode-descriptionForeground);flex:none}
@media (max-width:560px){.vs-act{display:none}}
.vs-main{flex:1;min-width:0;display:flex;flex-direction:column}
.vs-tabs{display:flex;background:var(--vscode-tab-inactiveBackground);border-bottom:1px solid var(--vscode-widget-border);overflow-x:auto;flex:none}
.vs-tab{display:flex;align-items:center;gap:6px;padding:0 12px;height:34px;font-size:13px;border:0;border-right:1px solid var(--vscode-widget-border);background:transparent;color:var(--vscode-descriptionForeground);cursor:pointer;white-space:nowrap}
.vs-tab[aria-selected="true"]{background:var(--vscode-tab-activeBackground);color:var(--vscode-foreground)}
.vs-editor{flex:1;min-height:250px;overflow:auto;position:relative}
.code{font-family:var(--vscode-editor-font-family);font-size:13px;line-height:20px;padding:10px 0;white-space:pre;color:var(--vscode-foreground)}
.code i{display:inline-block;width:40px;text-align:right;padding-right:14px;color:var(--vscode-descriptionForeground);font-style:normal}
.vs-panel{height:280px;border-top:1px solid var(--vscode-widget-border);background:var(--vscode-panel-background);display:flex;flex-direction:column;flex:none}
.vs-ptabs{display:flex;gap:18px;padding:0 14px;height:34px;align-items:center;flex:none}
.vs-ptabs button{border:0;background:transparent;height:34px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--vscode-descriptionForeground);cursor:pointer;border-bottom:1px solid transparent;display:flex;gap:6px;align-items:center}
.vs-ptabs button[aria-selected="true"]{color:var(--vscode-foreground);border-bottom-color:var(--vscode-focusBorder)}
.vs-ptabs .sp{flex:1}
.vs-tico{border:0;background:transparent;width:26px;height:26px;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--vscode-foreground)}
.vs-tico:hover{background:var(--vscode-list-activeSelectionBackground)}
.vs-pbody{flex:1;min-height:0;display:flex}
.vs-term{flex:1;min-width:0;overflow:auto;font-family:var(--vscode-editor-font-family);font-size:12.5px;line-height:18px;padding:6px 14px;color:var(--vscode-terminal-foreground)}
.vs-term .ln{white-space:pre}
.vs-tlist{width:230px;border-left:1px solid var(--vscode-widget-border);overflow:auto;flex:none}
@media (max-width:700px){.vs-tlist{width:160px}}
.vs-titem{display:flex;align-items:center;gap:6px;width:100%;min-height:24px;padding:3px 8px;border:0;background:transparent;color:var(--vscode-foreground);cursor:pointer;font-size:13px;text-align:left}
.vs-titem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-titem[aria-selected="true"]{background:var(--vscode-list-activeSelectionBackground)}
.vs-tree{flex:1;overflow:auto;padding:4px 0}
.vs-row{display:flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;font-size:13px}
.vs-row .d{color:var(--vscode-descriptionForeground);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vs-row .grow{flex:1;min-width:0;display:flex;gap:8px;align-items:baseline;overflow:hidden}
.vs-row .grow>span:first-child{white-space:nowrap}
.vs-welcome{padding:12px 16px;display:flex;flex-direction:column;gap:10px;max-width:320px}
.vs-status{height:24px;background:var(--vscode-statusBar-background);color:var(--vscode-statusBar-foreground);border-top:1px solid var(--vscode-statusBar-border);display:flex;align-items:stretch;font-size:12px;flex:none}
.vs-status .it{display:flex;align-items:center;gap:4px;padding:0 8px;border:0;background:transparent;color:inherit;cursor:default;font-size:12px}
.vs-status button.it{cursor:pointer}
.vs-status button.it:hover{background:rgba(128,128,128,.18)}
.vs-status .it.warn{background:var(--vscode-statusBarItem-warningBackground);color:var(--vscode-statusBarItem-warningForeground)}
.vs-status .sp{flex:1}
.vbtn{border:0;border-radius:2px;padding:5px 12px;font-size:13px;cursor:pointer;background:var(--vscode-button-background);color:var(--vscode-button-foreground);min-height:28px}
.vbtn.sec{background:var(--vscode-button-secondaryBackground);color:var(--vscode-button-secondaryForeground)}
.vs-modal-scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:5;padding:16px}
.vs-modal{background:var(--vscode-editorWidget-background);border:1px solid var(--vscode-widget-border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:480px;width:100%;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
.vs-modal .hd{display:flex;gap:12px;align-items:flex-start}
.vs-modal .hd b{font-size:14px}
.vs-modal p{margin:0;white-space:pre-line;color:var(--vscode-foreground)}
.vs-modal .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.vs-qp{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:min(520px,94%);background:var(--vscode-editorWidget-background);border:1px solid var(--vscode-widget-border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:5;padding:6px}
.vs-qp .in{border:1px solid var(--vscode-focusBorder);background:var(--vscode-input-background);padding:5px 8px;font-size:13px;color:var(--vscode-descriptionForeground);border-radius:2px;margin-bottom:4px}
.vs-qp button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;color:var(--vscode-foreground);padding:5px 8px;border-radius:3px;cursor:pointer;text-align:left;font-size:13px}
.vs-qp button:hover,.vs-qp button:focus-visible{background:var(--vscode-list-activeSelectionBackground)}
.vs-qp button small{color:var(--vscode-descriptionForeground);font-size:12px}
.vs-qp .lbl{display:flex;gap:8px;align-items:center}
.vs-qp input.in{display:block;width:100%;box-sizing:border-box;color:var(--vscode-foreground);font:inherit;font-size:13px;outline:none}
.vs-qp .msg{font-size:12px;color:var(--vscode-descriptionForeground);padding:2px 8px 6px;display:flex;gap:6px;align-items:center}
.vs-qp .msg.err{color:var(--vscode-foreground);font-weight:600}
.wv .srv{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wv .code-srv{font-family:var(--vscode-editor-font-family);font-size:16px;font-weight:600}
.vs-toasts{position:absolute;right:12px;bottom:34px;display:flex;flex-direction:column;gap:8px;z-index:4;width:min(380px,92%)}
.vs-toast{background:var(--vscode-notifications-background);border:1px solid var(--vscode-widget-border);border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.3);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.vs-toast .hd{display:flex;gap:8px;align-items:flex-start}
.vs-toast .hd span{flex:1}
.vs-toast .btns{display:flex;justify-content:flex-end;gap:8px}
/* webview do pareamento: só variáveis --vscode-* */
.wv{padding:22px 26px;display:flex;flex-direction:column;gap:16px;max-width:640px;font-family:var(--vscode-font-family);color:var(--vscode-foreground)}
.wv h3{margin:0;font-size:18px;font-weight:600;display:flex;gap:10px;align-items:center}
.wv ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.wv .grid{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:20px;align-items:center}

.wv .btns{display:flex;gap:8px;flex-wrap:wrap}
.qr{width:150px;height:150px;background:#fff;padding:8px;border-radius:4px}
.api{margin-top:12px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.api code{font-family:var(--font-mono);font-size:12.5px;color:var(--ink)}
.simbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  {id:'be', name:'Backend', shell:'pwsh', cwd:'~/projetos/api'},
  {id:'fe', name:'Frontend', shell:'pwsh', cwd:'~/projetos/web'},
  {id:'bd', name:'Build', shell:'pwsh', cwd:'~/projetos/motor'},
];
function sess(id){ return SESS.find(s=>s.id===id); }
function attnCmd(){ return S.attnKind==='destructive' ? 'rm -rf dist' : 'npm run build'; }
function attnOpen(){ return S.attn==='open' || S.attn==='sending'; }
function status(id){
  if(id==='cc'){ if(S.ended==='cc') return {k:'exited_ok',tone:'ok',icon:'check',label:t('status.exited_ok')};
    return attnOpen() ? {k:'waiting_permission',tone:'attn',icon:'bell',label:t('status.waiting_permission')} : {k:'running',tone:'neutral',icon:'play',label:t('status.running')}; }
  if(id==='be') return {k:'running',tone:'neutral',icon:'play',label:t('status.running')};
  if(id==='fe') return {k:'prompt',tone:'neutral',icon:'prompt',label:t('status.prompt')};
  if(id==='bd') return {k:'exited_err',tone:'danger',icon:'x',label:t('status.exited_err',{exit:1})};
}
function ctx(id){
  if(id==='cc') return attnOpen() ? t('ctx.claude_tool',{tool:'Bash'})+' · '+attnCmd() : t('ctx.claude_tool',{tool:'Bash'});
  if(id==='be') return t('ctx.running_cmd',{cmd:'npm run dev'});
  if(id==='fe') return t('ctx.last_cmd',{cmd:'npm test'})+' · exit 0';
  if(id==='bd') return t('ctx.last_cmd',{cmd:'cargo build --release'})+' · '+t('ctx.ended_at',{time:'14:21'});
}

const OLDER = [
  [['PS C:\\projetos\\api> ','t-blue'],['git status','t-b']],
  [['On branch main','']],[['nothing to commit, working tree clean','t-dim']],

function renderLines(arr){ return arr.map(l=>`<div class="ln">${l.map(([tx,c])=>`<span class="${c||''}">${h(tx)}</span>`).join('')}</div>`).join(''); }

/* ---------- navegação ---------- */
function go(scr, keepStack){ if(!keepStack && S.screen!==scr) S.stack.push(S.screen); S.screen=scr; S.overlay=null; S.snack=null; S.heads=false; }
function back(){ S.overlay=null; S.screen = S.stack.pop() || 'pcs'; }

/* ---------- peças comuns ---------- */
function appbar(title, sub, opts){ opts=opts||{};
  return `<div class="appbar">${opts.noBack?'':`<button class="ib" data-act="back" aria-label="${T('common.back')}">${ic('back')}</button>`}
  <div class="ttl"><b>${h(title)}</b>${sub?`<small>${h(sub)}</small>`:''}</div>${opts.right||''}</div>`;
}
function globalBanners(){
  let b='';
  if(S.net==='none') b+=`<div class="banner neutral" role="status">${ic('wifioff','s18')}<div class="grow">${T('global.no_network')}</div></div>`;
  else if(S.net==='bridge') b+=`<div class="banner danger" role="status">${ic('cloudoff','s18')}<div class="grow">${T('global.bridge_down',{bridge:MY_SERVER})}</div><div class="act"><button class="btn text" data-act="retry">${T('common.retry')}</button></div></div>`;
  else if(S.net==='reconnecting') b+=`<div class="banner neutral" role="status"><span class="spinner" style="width:18px;height:18px;border-width:2px"></span><div class="grow">${T('global.reconnecting',{n:3})}</div><div class="act"><button class="btn text" data-act="retry">${T('common.retry')}</button></div></div>`;
  if(S.outdated) b+=`<div class="banner danger" role="status">${ic('alert','s18')}<div class="grow">${T('global.outdated',{pc:PC})}</div><div class="act"><button class="btn text" data-act="noop">${T('global.outdated_cta')}</button></div></div>`;
  if(S.outdatedPc) b+=`<div class="banner danger" role="status">${ic('alert','s18')}<div class="grow">${T('global.outdated_pc',{pc:PC})}</div></div>`;
  return b;
}
function snack(){ if(!S.snack) return ''; return `<div class="snack" role="status"><div class="grow">${h(S.snack.text)}</div>${S.snack.act?`<button class="btn text" style="color:var(--accent)" data-act="${S.snack.act}">${h(S.snack.actLabel)}</button>`:''}</div>`; }
function heads(){ if(!S.heads) return ''; return `<button class="heads" data-act="openNotif">${appIcon()}<span><small>${T('notif.title')} · ${T('common.now')}</small><b style="font-weight:600">${T('notif.attn',{pc:PC})}</b></span></button>`; }

sessions(){
  const sub = S.pc==='online' ? t('pcs.online') : S.pc==='cut' ? t('pcs.cut') : t('pcs.offline_since',{time:'14:02'});
  let top = appbar(PC, sub, {right:`<button class="ib" data-act="go:devices" aria-label="${T('devices.title')}">${ic('shield')}</button>`}) + globalBanners();
  if(S.pc==='cut') return top + `<div class="empty"><span class="st off" style="width:56px;height:56px;border-radius:14px">${ic('slash')}</span><h2 class="h1" style="font-size:20px">${T('global.cut_title',{pc:PC})}</h2><p class="body">${T('global.cut_body')}</p></div>`;
  if(S.pc==='offline') top += `<div class="banner neutral" role="status">${ic('pc','s18')}<div class="grow">${T('global.pc_offline',{pc:PC,time:'14:02'})}</div><div class="act"><button class="btn text" data-act="retry">${T('common.retry')}</button></div></div>`;
  if(S.pc==='offline') return top + `<div class="empty"><p class="body">${T('global.pc_offline_empty')}</p></div>`;
  if(S.emptySessions) return top + `<div class="empty"><span class="st neutral" style="width:56px;height:56px;border-radius:14px">${ic('term')}</span><h2 class="h2">${T('sessions.empty_title')}</h2><p class="body">${T(S.notDefault?'sessions.empty_body_not_default':'sessions.empty_body')}</p></div>`;
  const ab = attnOpen() ? `<div class="banner attn">${ic('bell','s18')}<div class="grow" style="font-weight:600">${T('sessions.attn_banner_one')}</div><div class="act"><button class="btn text" data-act="go:attn">${T('sessions.attn_banner_cta')}</button></div></div>` : '';
  const row = (s)=>{ const st=status(s.id); const arm=isArmed(s.id);
    const a11y = t('sessions.item_a11y',{session:s.name,status:st.label,context:ctx(s.id)}) + (arm?'. '+t('sessions.armed_chip_a11y',{time:mmss(armedLeft(s.id))}):'');

},
session(){
  const s = sess(S.sid), st = status(s.id), arm = isArmed(s.id), ended = st.k.indexOf('exited')===0 || S.ended===s.id;
  const right = `<button class="ib" data-act="openTerminate" aria-label="${T('session.menu_terminate')}">${ic('more')}</button>`;
  let mode = '';
  if(ended) mode = `<div class="banner ${st.tone==='danger'?'danger':'neutral'}" role="status">${ic(st.tone==='danger'?'x':'check','s18')}<div class="grow">${S.lost?T('session.lost_banner',{time:'14:10'}):T('session.exited_banner',{exit: s.id==='bd'?1:0, time:'14:21'})}</div></div>`;
  else if(arm) mode = `<div class="modebar on" role="status">${ic('unlock','s18')}<div class="grow"><b data-until="${S.armed[s.id]}" data-fmt="session.armed_bar"></b><small>${T('session.armed_hint')}</small></div><button class="btn secondary" data-act="disarm">${ic('lock','s16')}${T('session.disarm')}</button></div>`;
  else mode = `<div class="modebar ro">${ic('lock','s18')}<div class="grow"><b>${T('session.readonly_bar')}</b><small>${T('session.readonly_hint')}</small></div><button class="btn primary" data-act="openArm">${T('session.arm_cta')}</button></div>`;
  let hist = '';
  if(s.id==='cc'){
    if(S.histEnd) hist = `<div class="meta">${ic('hist','s16')}${T('session.history_start')}</div>`;
    else if(S.histLoading) hist = `<div class="meta" role="status"><span class="spinner" style="width:14px;height:14px;border-width:2px"></span>${T('session.history_loading')}</div>`;
    else hist = `<div class="meta"><button class="btn text" style="min-height:44px;padding:0 4px" data-act="histLoad">${ic('hist','s16')}${T('session.history_load')}</button></div>`;
  }
  const older = s.id==='cc' && S.hist>0 ? renderLines(OLDER) : '';
  const L = lines(s.id);
  const term = `<div class="term" role="log" aria-label="${T('session.terminal_a11y',{session:s.name,n:L.length})}" tabindex="0">${hist}${older}${renderLines(L)}</div>`;
  const pinned = (s.id==='cc' && attnOpen()) ? `<div class="pinned">${ic('bell','s18')}<span class="grow">${T('session.attn_pinned',{cmd:attnCmd()})}</span><button class="btn" data-act="go:attn">${T('session.attn_view')}</button></div>` : '';
  let composer = '';
  if(!ended){
    const dis = !arm;
    const sl = S.send==='sending'?`<p id="sendWhy" class="statusline" role="status">${T('session.sending')}</p>`
      : S.send==='sent'?`<p id="sendWhy" class="statusline ok" role="status">${T('session.sent')}</p>`

  const s = sess(S.sid);
  if(S.overlay==='arm'){

    let body;
    if(S.policyOff) body = `<div class="note neutral">${ic('slash','s18')}<span>${T('arm.policy_off',{pc:PC})}</span></div><button class="btn secondary full" data-act="closeOverlay">${T('common.close')}</button>`;

    else body = `<p class="body">${T('arm.body')}</p>

      <button class="btn text full" data-act="closeOverlay">${T('common.cancel')}</button>`;

  }
  if(S.overlay==='bio'){
    const isArm = S.bioFor==='arm';
    const title = isArm ? t('arm.bio_title') : S.bioFor==='terminate' ? t('terminate.cta') : t('attn.bio_title');
    const sub = isArm ? t('arm.bio_subtitle',{session:s.name,pc:PC,n:S.armMin}) : S.bioFor==='terminate' ? s.name+' · '+PC : t('attn.bio_subtitle',{cmd:attnCmd(),session:'Claude Code'});
    return `<div class="scrim"><div class="bio" role="dialog" aria-modal="true" aria-labelledby="bioT">${appIcon()}<h2 class="h2" id="bioT">${h(title)}</h2><p class="body">${h(sub)}</p>

  }
  if(S.overlay==='terminate') return `<div class="scrim center" data-act="closeOverlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="trT" data-stop><h2 class="h2" id="trT">${T('terminate.title',{session:s.name})}</h2><p class="body">${T('terminate.body',{pc:PC})}</p><div class="btns"><button class="btn text" data-act="closeOverlay">${T('common.cancel')}</button><button class="btn danger" data-act="terminateConfirm">${ic('fp','s18')}${T('terminate.cta')}</button></div></div></div>`;

  if(S.overlay==='noticeMenu'){ const n=S.notices.find(x=>x.id===S.noticeMenu); if(n) return `<div class="scrim" data-act="closeOverlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="nmT" data-stop><div class="grab"></div><h2 class="h2 mono" id="nmT">${h(n.source)}</h2><button class="btn secondary full" data-act="noticeMute:${n.id}">${ic('slash','s18')}${T('notices.mute',{source:n.source})}</button><button class="btn text full" data-act="closeOverlay">${T('common.cancel')}</button></div></div>`; }
  if(S.overlay==='remove') return `<div class="scrim center" data-act="closeOverlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rmT" data-stop><h2 class="h2" id="rmT">${T('devices.remove_confirm_title',{pc:PC})}</h2><p class="body">${T('devices.remove_confirm_body')}</p><div class="btns"><button class="btn text" data-act="closeOverlay">${T('common.cancel')}</button><button class="btn danger" data-act="removeConfirm">${T('devices.remove_confirm_cta',{pc:PC})}</button></div></div></div>`;

function qrSvg(){
  let seed=48219137; const r=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const N=29; let rects='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9); if(!inF && r()>.52) rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`; }
  return `<svg class="qr" viewBox="0 0 ${N} ${N}" role="img" aria-label="${T('vsc.pair_qr_alt')} (${T('proto.fake_qr')})" shape-rendering="crispEdges"><rect width="${N}" height="${N}" fill="#fff"/>${rects}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

     <div class="btns" style="margin-top:6px"><button class="vbtn sec" data-act="vsHide">${ic(v.hidden?'eye':'eye','s16')} ${v.hidden?T('vsc.pair_show'):T('vsc.pair_hide')}</button><button class="vbtn sec" data-act="vsNewCode">${T('vsc.pair_new')}</button></div></div>

  noticeDismissAll(){ S.notices=[]; },
  unmute(src){ S.muted=S.muted.filter(x=>x!==src); },
  openNotices(){ S.heads=false; S.notices=NOTICES.slice(); go('sessions'); },
  pairCancel(){ S.vs.modal=null; S.vs.pairState='waiting'; back(); },
  openSession(id){ S.sid=id; S.send=null; S.hist=0; S.histEnd=false; go('session'); },
  openArm(){ S.overlay='arm'; S.snack=null; }, closeOverlay(){ S.overlay=null; },
  armMin(n){ S.armMin=+n; }, armConfirm(){ S.bioFor='arm'; S.overlay='bio'; },
  bioOk(){ if(S.bioFor==='arm') arm(); else if(S.bioFor==='attn'){ S.overlay=null; S.attn='sending'; setTimeout(()=>{ S.attn='allowed'; render(); },700); }
    else if(S.bioFor==='terminate'){ S.overlay=null; S.snack={text:t('status.killed')+' · '+sess(S.sid).name}; } },
  disarm(){ delete S.armed[S.sid]; S.snack={text:t('arm.expired')}; },
  histLoad(){ S.histLoading=true; setTimeout(()=>{ S.histLoading=false; S.hist=1; S.histEnd=true; render(); },700); },
  key(k){ if(!isArmed(S.sid)) { S.send=null; return; } S.snack={text:t('session.sent')+' '+({esc:'Esc',tab:'Tab',left:'←',up:'↑',down:'↓',right:'→',enter:'Enter',ctrlc:'Ctrl+C'}[k])}; },
  go_attn(){},
  attnAllow(){ if(S.attnKind==='destructive' || !isArmed('cc')){ S.bioFor='attn'; S.overlay='bio'; } else { S.attn='sending'; setTimeout(()=>{ S.attn='allowed'; render(); },700); } },
  attnDeny(){ S.attn='sending'; setTimeout(()=>{ S.attn='denied'; render(); },600); },
  openNotif(){ S.heads=false; go('attn'); },
  openTerminate(){ S.overlay='terminate'; }, terminateConfirm(){ S.bioFor='terminate'; S.overlay='bio'; },
  openRemove(){ S.overlay='remove'; }, removeConfirm(){ S.overlay=null; S.vs.devices=S.vs.devices.filter(d=>d.id!=='p8'); toast({text:t('vsc.revoked_toast',{device:'Pixel 8'})}); S.stack=[]; S.screen='welcome'; },
  toggleShots(){ S.shots=!S.shots; }, toggleLock(){ S.appLock=!S.appLock; },
  'settings.language'(v){ S.settingsLang=v; if(v!=='system') S.lang=v; },
  'settings.theme'(v){ S.settingsTheme=v; setTheme(v); },
  /* VS Code */
  vsQp(){ S.vs.qp=!S.vs.qp; }, vsTab(a){ S.vs.tab=a; }, vsTerm(a){ S.vs.active=a; }, vsEditor(a){ S.vs.editor=a; },
  vsPair(){ S.vs.qp=false; if(!S.vs.bridge){ S.vs.input='bridge'; S.vs.draft=''; S.vs.bad=false; return; } S.vs.pair=true; S.vs.editor='pair'; S.vs.pairState='waiting'; S.vs.pairEnd=Date.now()+5*60000; },
  vsShowTree(){ S.vs.qp=false; S.vs.tab='pipa'; },
  vsSetBridge(){ S.vs.qp=false; S.vs.input='bridge'; S.vs.draft=S.vs.bridge; S.vs.bad=false; },
  vsCopy(){ toast({text:t('vsc.pair_copied')}); },
  vsNewCode(){ S.vs.pairState='waiting'; S.vs.pairEnd=Date.now()+5*60000; },
  vsHide(){ S.vs.hidden=!S.vs.hidden; },
  vsAllow(){ S.vs.modal=null; S.vs.pairState='success'; S.vs.paired=true; if(!S.vs.devices.some(d=>d.name===S.deviceName)) S.vs.devices.unshift({id:'n'+Date.now(),name:S.deviceName,state:'connected'}); S.stack=[]; S.screen='pairSuccess'; },
  vsDeny(){ S.vs.modal=null; S.vs.pairState='rejected'; S.addTab='code'; S.pairErr='rejected'; S.screen='add'; },
  vsDisarm(){ S.vs.qp=false; delete S.armed.cc; S.vs.toasts=[]; toast({text:t('vsc.disarmed_toast',{device:'Pixel 8'})}); if(S.screen==='session'||S.screen==='sessions') S.snack={text:t('arm.disarmed_by_pc')}; },
  vsCut(){ S.vs.qp=false; S.vs.mode='cut'; S.pc='cut'; S.armed={}; S.overlay=null; toast({text:t('vsc.cut_toast'),act:'vsRestore',actLabel:t('vsc.restore'),warn:true}); if(['session','attn'].includes(S.screen)) S.screen='sessions'; },
  vsRestore(){ S.vs.qp=false; S.vs.mode='normal'; S.pc='online'; S.vs.toasts=[]; toast({text:t('vsc.restored_toast')}); },
  vsStart(){ S.vs.mode='normal'; S.pc='online'; },
  vsRevoke(id){ S.vs.modal='revoke:'+id; }, vsModalClose(){ S.vs.modal=null; },
  vsRevokeYes(id){ const d=S.vs.devices.find(x=>x.id===id); S.vs.modal=null; S.vs.devices=S.vs.devices.filter(x=>x.id!==id); toast({text:t('vsc.revoked_toast',{device:d.name})}); if(d.name==='Pixel 8'||d.name===S.deviceName){ S.stack=[]; S.overlay=null; S.screen='revoked'; } },
  vsToastClose(i){ S.vs.toasts.splice(+i,1); },
  simClaim(){ if(S.screen!=='add'&&S.screen!=='welcome'){ S.stack=[]; S.screen='add'; } startPair(); return 'skip'; },
  simAttn(){ S.attn='open'; S.heads=true; },
};
function setTheme(v){ if(v==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',v); }
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-proto]');
  if(p){ const [k,v]=p.dataset.proto.split(':'); if(k==='lang'){ S.lang=v; } if(k==='theme'){ setTheme(v); } if(k==='reset'){ const l=S.lang; Object.assign(S,fresh()); S.lang=l; document.getElementById('jump').value='welcome'; } render(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.hasAttribute('data-stop') ) return;
  if(e.target.closest('[data-stop]') && el.classList.contains('scrim')) return;
  if(el.getAttribute('aria-disabled')==='true'){ e.preventDefault(); const w=document.getElementById('sendWhy')||document.getElementById('codeLeft'); if(w) w.style.fontWeight='700'; return; }
  const [k,...r]=el.dataset.act.split(':'); const a=r.join(':');
  e.preventDefault();
  if(k==='go'){ ACT.go(a); } else if(ACT[k]){ if(ACT[k](a)==='skip') return; }
  render();
});
document.addEventListener('submit',e=>{ e.preventDefault(); const f=e.target.dataset.form;
  if(f==='code'){ if(S.code.length===12 && S.server.trim()){ S.server=S.server.trim(); S.pairErr=null; startPair(); } return; }
  if(f==='vsInput'){ const v=S.vs, val=v.draft.trim();
    if(v.input==='bridge'){ if(!/^[a-z0-9-]+(\.[a-z0-9-]+)+(:\d{1,5})?$/i.test(val)){ v.bad=true; render(); return; } v.bridge=val.toLowerCase(); v.input='enroll'; v.draft=''; v.bad=false; render(); return; }
    if(!val){ v.bad=true; render(); return; }
    v.input=null; v.draft=''; v.bad=false; ACT.vsPair(); render(); return; }
  if(f==='send'){ if(!isArmed(S.sid)){ S.send='not_armed'; render(); return; } if(!S.draft.trim()) return; if(/\r|\n/.test(S.draft)){ S.send='multiline'; render(); return; } S.send='sending'; render();
    setTimeout(()=>{ S.sent.push(S.draft); S.draft=''; S.send='sent'; render(); },600); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='code'){ const d=e.target.value.replace(/\D/g,'').slice(0,12); S.code=d; e.target.value=fmtCode(d);
    const full=d.length===12; document.getElementById('codeLeft').textContent = full?t('add.code_complete'):t('add.code_missing',{n:12-d.length});
    document.getElementById('codeSubmit').setAttribute('aria-disabled', !(full && S.server.trim().length>0)); }
  if(e.target.id==='draft'){ S.draft=e.target.value; }
  if(e.target.id==='srv'){ S.server=e.target.value; const ok=S.server.trim().length>0; document.getElementById('srvMissing').textContent = ok?'':t('add.server_missing');
    const sb=document.getElementById('codeSubmit'); if(sb) sb.setAttribute('aria-disabled', !(ok && S.code.length===12)); }
  if(e.target.id==='vsIn'){ S.vs.draft=e.target.value; }
  if(e.target.id==='dname'){ S.deviceName=e.target.value||'Pixel 8'; }
});
/* Colar várias linhas no campo de envio: nada é enviado e o texto fica (AJ-10). */
document.addEventListener('paste',e=>{ if(e.target.id!=='draft') return; const tx=(e.clipboardData||window.clipboardData).getData('text'); if(/\r|\n/.test(tx)){ e.preventDefault(); S.draft=tx; S.send='multiline'; render(); } });
document.getElementById('jump').addEventListener('change',e=>applyPreset(e.target.value));
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-until]').forEach(el=>{ el.textContent = t(el.dataset.fmt,{time:mmss(+el.dataset.until-now)}); });
  let changed=false;
  for(const k in S.armed){ if(S.armed[k]<=now){ delete S.armed[k]; changed=true; if(S.screen==='session'&&S.sid===k){ S.snack={text:t('arm.expired')}; if(S.draft) S.send=null; } } }
  if(S.vs.pair && S.vs.pairState==='waiting' && S.vs.pairEnd<=now){ S.vs.pairState='expired'; changed=true; }
  return changed;
}
setInterval(()=>{ if(tick()) render(); },1000);
render();
/* link direto para um estado: ...#session_armed */
(function(){ const id=location.hash.slice(1); if(id && PRESETS.some(([,it])=>it.some(([p])=>p===id))){ applyPreset(id); document.getElementById('jump').value=id; } })();
</script>
